application:
  subdomain: onedev
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  upstreams:
    - location: /
      backend: http://onedev-server:6610/
  injects:
    - id: login-autofill
      on: browser
      when:
        - /~login
      do:
        - src: builtin://simple-inject-password
          params:
            user: {{ .U.initial_user }}
            password: {{ .U.initial_password }}
  ingress:
    - protocol: tcp
      port: 6611
      service: onedev-server
services:
  onedev-server:
    # 1dev/server:11.6.16
    # upstream: 1dev/server:16.5.9
    image: registry.lazycat.cloud/czyt/1dev/server:93faef09d2e05977
    binds:
      - /lzcapp/var/docker.sock:/var/run/docker.sock
      - /lzcapp/var/onedev:/opt/onedev
    environment:
      - initial_server_url=https://${LAZYCAT_APP_DOMAIN}
      - {{ printf "initial_user=%s" .U.initial_user | quote }}
      - {{ printf "initial_password=%s" .U.initial_password | quote }}
      - {{ printf "initial_email=%s" .U.initial_email | quote }}
